 <main>
  <!-- Company Information Section-->

          <!-- Embedded Google Map -->

          </iframe>
        
   </section>

   <!-- employee section-->
    <section class="team">
      <h2> Meet Our Team </h2>
      <figure>
        <img src="images/employee1.jpeg"/>
      <figcaption>Customer Support - Mike</figcaption>
      </figure>

      <figure>
        <img src="images/employee2.jpeg"/>
        <figcaption> Reservation Manager - Lisa </figcaption>
      </figure>
      
      <figure>
        <img src="images/employee3.jpeg"/>
        <figcaption> Riveer Guide 1 - Maria </figcaption>
      </figure>

      <figure>
        <img src="images/employee5.jpeg"/>
        <figcaption> River Guide 2 - Laura </figcaption>
      </figure>

      <figure>
        <img src="images/employee4.jpeg">
        <figcaption>River Guide 3 - Julia </figcaption>
      </figure>

      <!-- Contact Form Section -->
       <section class=" Contact-Form">
        <h2> Send Us a Message </h2>
        <form action="#" method="post">

          <label for="name"> Name: </label>
          <input type="text" id="name" name="name" required/>

          <!-- user email input-->
           <label for="email"> Email:</label>
           <input type="email" name="email" id="email" name="email" required/>

           <!-- Purpose of message with radio buttons -->
        <p>Purpose of your message:</p>
        <label><input type="radio" name="purpose" value="general" required /> General Inquiry</label><br />
        <label><input type="radio" name="purpose" value="reservation" /> Reservation Question</label><br />
        <label><input type="radio" name="purpose" value="suggestion" /> Website Suggestion</label><br />

        <!-- User message text area -->
        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <!-- Newsletter subscription checkbox -->
        <label>
          <input type="checkbox" name="subscribe" />
          Please subscribe me to the monthly newsletter
        </label>

        <!-- Submit button with accessible and descriptive text -->
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
